# Cada Service selecciona SOLO por "app": los pods stable y canary reciben
# tráfico en proporción a sus réplicas (4 stable + 1 canary = 20 % canary).
apiVersion: v1
kind: Service
metadata:
  name: station-reservation-service
  namespace: aegisvolt
spec:
  selector: { app: station-reservation-service }
  ports: [{ name: http, port: 80, targetPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: billing-wallet-service
  namespace: aegisvolt
spec:
  selector: { app: billing-wallet-service }
  ports: [{ name: http, port: 80, targetPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: energy-dispatch-service
  namespace: aegisvolt
spec:
  selector: { app: energy-dispatch-service }
  ports: [{ name: http, port: 80, targetPort: 8080 }]
---
# NodePort 30080: destino del NLB interno (Terraform: modules/k8s_ingress).
apiVersion: v1
kind: Service
metadata:
  name: graphql-gateway
  namespace: aegisvolt
spec:
  type: NodePort
  selector: { app: graphql-gateway }
  ports: [{ name: http, port: 80, targetPort: 8080, nodePort: 30080 }]
